$kind: http-request
url: "{{url-knox-service}}/v2/ledgers/camp-summer-2026/reservations"
method: POST
headers:
  X-Sub-Merchant-Id: "{{X-Sub-Merchant-Id}}"
  X-Tenant-Id: "{{X-Tenant-Id}}"
  idempotency-key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerReference": "{{memberID}}",
      "assetCode": "EUR",
      "requestedAmount": 20.0,
      "expiresAt": "2026-12-15T00:00:00Z",
      "externalReference": "order_12345",
      "classification": "STORE_REDEMPTION",
      "description": "Reserve EUR for checkout",
      "metadata": {
        "channel": "web-checkout"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{azure_token}}"
order: 3000
