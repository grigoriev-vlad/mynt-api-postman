    {
      "ledgerId": "camp-summer-2026-eur",
      "ledgerName": "Summer wallet campaign 2026",
      "ledgerType": "VALUE",
      "assetCode": "EUR",
      "startDate": "2026-06-01T00:00:00Z",
      "endDate": "2026-08-31T23:59:59Z",
