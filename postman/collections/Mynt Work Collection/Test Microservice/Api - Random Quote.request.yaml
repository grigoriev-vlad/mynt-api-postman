$kind: http-request
url: https://eu-mynt-testing.kaas.nonprd.k8s.ah.technology/api/random-quote
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON and Content-Type includes application/json\", function () {\r

      \    pm.response.to.be.json;\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Body has required properties: id, quote, author\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"id\");\r

      \    pm.expect(jsonData).to.have.property(\"quote\");\r

      \    pm.expect(jsonData).to.have.property(\"author\");\r

      });\r

      \r

      pm.test(\"id is a string\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.id).to.be.a(\"number\");\r

      });\r

      \r

      pm.test(\"quote is a string\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.quote).to.be.a(\"string\");\r

      });\r

      \r

      pm.test(\"author is a non-empty string\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.author).to.be.a(\"string\");\r

      \    pm.expect(jsonData.author.length).to.be.greaterThan(0);\r

      });\r

      \r

      pm.test(\"Response time is under 500ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(500);\r

      });"
    language: text/javascript
order: 2000
