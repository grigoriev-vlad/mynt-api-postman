$kind: http-request
url: "{{url-ledger-proxy}}/v1/pos/transactions/cancel"
method: POST
headers:
  accept: "*/*"
  Content-Type: application/json
  X-Tenant-Id: "{{X-Tenant-Id}}"
body:
  type: json
  content: |-
    {
    "cardNumber": "{{cardID}}",
    "lockKey": "{{lockKey}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
order: 2000
