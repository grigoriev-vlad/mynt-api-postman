$kind: http-request
url: "{{url-ledger-proxy}}/v1/pos/transactions/start"
method: POST
headers:
  X-tenant-Id: "{{X-Tenant-Id}}"
body:
  type: json
  content: |-
    {
      "cardNumber": "{{cardID}}",
      "metadata": {
        "storeId": "1234",
        "posId": "456",
        "cashierId": "789",
        "transactionId": "012",
        "orderId": "345",
        "businessDate": "2026-10-05",
        "startTransactionTimestamp": "2026-10-05T15:10:44.231Z"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
order: 1000
