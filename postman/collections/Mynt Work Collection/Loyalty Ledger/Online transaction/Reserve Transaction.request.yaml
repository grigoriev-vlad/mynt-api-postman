$kind: http-request
url: "{{url-ledger-proxy}}/v1/online/transactions/reserve"
method: POST
headers:
  accept: application/json
  X-Tenant-Id: "{{X-Tenant-Id}}"
  Content-Type: application/json
  X-Use-Mock: "true"
body:
  type: json
  content: |-
    {
      "memberId": "{{memberID}}",
      "orderId": "12345",
      "reservationId": "",
      "lockKey": "{{lockKey}}",
      "metadata": {
        "storeId": "12345",
        "businessDate": "2026-09-08",
        "startTransactionTimestamp": "2026-09-08T12:40:58.175Z"
      },
      "ledgerUpdates": [
        {
          "type": "VALUE",
          "code": "97",
          "delta": 10
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
order: 3000
