headers:
  - key: X-Tenant-Id
    value: "{{X-Tenant-Id}}"
  - key: X-Use-Mock
    value: "true"
    disabled: true
body:
  type: json
  content: "{\r

    \  \"memberIdentity\": {\r

    \    \"memberId\": \"{{memberID}}\",\r

    \    \"householdId\": \"{{householdID}}\"\r

    \  },\r

    \  \"transactionType\": \"CUSTOMER_CARE_CORRECTION\",\r

    \  \"offerId\": \"BE11763095\",\r

    \  \"amount\": 3,\r

    \  \"description\": [\r

    \    {\r

    \      \"language\": \"en\",\r

    \      \"text\": \"20 points were exchanged for 2 ${PROMOTION_NAME}\"\r

    \    }\r

    \  ],\r

    \  \"metadata\": {\r

    \    \"additionalProp1\": {}\r

    \  }\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
order: 7000
