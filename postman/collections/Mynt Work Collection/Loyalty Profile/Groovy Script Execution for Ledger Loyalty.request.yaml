$kind: http-request
url: "{{url-ledger-proxy}}/backoffice/groovy"
method: POST
headers:
  Content-Type: application/json
  X-Tenant-Id: "{{X-Tenant-Id}}"
body:
  type: json
  content: "{\r

    \  \"commitMode\": true,\r

    \  \"params\": {},\r

    \  \"script\": \"{{groovyScript}}\",\r

    \  \"timeoutMs\": 50000\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
  - type: beforeRequest
    code: "const script = [\r

      \  'import com.aholddelhaize.mynt.core.data.source.TenantContext',\r

      \  'import com.aholddelhaize.loyalty.promotions.jobs.rewardachievementcleanup.RewardAchievementCleanupCronTask',\r

      \  '',\r

      \  'def tenantId = TenantContext.getTenantId()',\r

      \  'def task = ctx.getBean(RewardAchievementCleanupCronTask.class)',\r

      \  '',\r

      \  'task.cleanupRewardAchievements(tenantId)',\r

      \  '',\r

      \  'out.println(\"Reward-achievement cleanup workflow start requested.\")',\r

      ].join('\\n');\r

      pm.environment.set(\"groovyScript\", JSON.stringify(script).slice(1, -1));"
    language: text/javascript
order: 5000
