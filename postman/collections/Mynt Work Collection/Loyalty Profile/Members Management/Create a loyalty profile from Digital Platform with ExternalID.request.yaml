$kind: http-request
url: "{{url-loyalty-profile}}/v1/members"
method: POST
headers:
  X-Tenant-Id: "{{X-Tenant-Id}}"
body:
  type: json
  content: "{\t\r

    \    \"cardNumber\": \"\",\r

    \      \"initialAttributes\": [\r

    \    {\r

    \      \"key\": \"LANGUAGE\",\r

    \      \"value\": \"EN\"\r

    \    },\r

    \    {\r

    \      \"key\": \"LAST_NAME\",\r

    \      \"value\": \"\"\r

    \    },\r

    \    {\r

    \      \"key\": \"MOBILE_PHONE_NUMBER\",\r

    \      \"value\": \"3456345645645\"\r

    \    },\r

    \    {\r

    \      \"key\": \"TELEPHONE_NUMBER\",\r

    \      \"value\": \"45645645645\"\r

    \    }\r

    \r

    \  ]\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{ciam_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Create member - 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      if (pm.response.code === 201) {\r

      \    const jsonData = pm.response.json();\r

      \r

      \    // Values can sit at different nesting levels depending on endpoint, so search recursively.\r

      \    function findValue(source, key) {\r

      \        if (source === null || typeof source !== \"object\") return undefined;\r

      \        if (Array.isArray(source)) {\r

      \            for (const item of source) {\r

      \                const found = findValue(item, key);\r

      \                if (found !== undefined) return found;\r

      \            }\r

      \            return undefined;\r

      \        }\r

      \        if (Object.prototype.hasOwnProperty.call(source, key) && source[key] !== null) {\r

      \            return source[key];\r

      \        }\r

      \        for (const nested of Object.values(source)) {\r

      \            const found = findValue(nested, key);\r

      \            if (found !== undefined) return found;\r

      \        }\r

      \        return undefined;\r

      \    }\r

      \r

      \    const mappings = [\r

      \        { responseKey: \"memberId\",   envVar: \"memberID\" },\r

      \        { responseKey: \"householdId\", envVar: \"householdID\" },\r

      \        { responseKey: \"id\",          envVar: \"externalID\" },\r

      \        { responseKey: \"key\",         envVar: \"lockKey\" },\r

      \        { responseKey: \"cardNumber\",  envVar: \"cardID\" }\r

      \    ];\r

      \r

      \    mappings.forEach(function (m) {\r

      \        const value = findValue(jsonData, m.responseKey);\r

      \        if (value !== undefined) {\r

      \            pm.environment.set(m.envVar, String(value));\r

      \            console.log(m.envVar + \" = \" + value);\r

      \        } else {\r

      \            console.warn(\"Not found in response: \" + m.responseKey);\r

      \        }\r

      \    });\r

      \r

      \    pm.test(\"Environment variables saved\", function () {\r

      \        pm.expect(pm.environment.get(\"memberID\")).to.not.be.undefined;\r

      \    });\r

      }"
    language: text/javascript
order: 6000
